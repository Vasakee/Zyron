version: "3.7"
services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_DB=postgres
      - DATBASE_URL=postgres://postgres:postgres@localhost:5432/postgres
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
