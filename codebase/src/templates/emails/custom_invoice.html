<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Receipt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial,
        sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }

    .a4-page {
      width: 210mm;
      height: 297mm;
      background-color: white;
      margin: 20px auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
      page-break-after: always;
    }

    .bottom-divider,
    .top-divider {
      position: relative;
    }

    .bottom-divider::after {
      content: '';
      position: absolute;
      width: 92%;
      height: 2px;
      background-color: #e5e7eb;
      bottom: 0;
      left: 4%;
    }

    .top-divider::before {
      content: '';
      position: absolute;
      width: 92%;
      height: 2px;
      background-color: #e5e7eb;
      top: 0;
      left: 4%;
    }

    .page-header {
      height: 40mm;
      padding: 32px;
      display: flex;
      flex-direction: column;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 5px;
    }

    .header-left img {
      height: 32px;
      width: auto;
    }

    .header-right h2 {
      font-size: 28px;
      color: #19233f;
      font-weight: 700;
      margin: 0;
    }

    .header-bottom {
      display: flex;
      justify-content: space-between;
    }

    .header-info p {
      font-size: 16px;
      color: #6b7280;
      margin: 0 0 4px 0;
    }

    .header-info span {
      color: #111827;
      font-weight: 600;
    }

    .header-right-info {
      text-align: right;
    }

    .header-right-info p {
      font-size: 16px;
      color: #6b7280;
      margin: 0;
    }

    .header-right-info span {
      color: #111827;
      font-weight: 600;
    }

    .billing-section {
      height: 50mm;
      padding: 20px 32px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .billing-details {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 40px;
    }

    .billing-from,
    .billing-to {
      flex: 1;
    }

    .billing-label {
      font-size: 18px;
      color: #19233f;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .billing-from p,
    .billing-to p {
      font-size: 16px;
      color: #6b7280;
      margin: 2px 0;
      line-height: 1.4;
    }

    .billing-from p:nth-child(2),
    .billing-to p:nth-child(2) {
      color: #19233f;
      font-weight: 600;
      margin-top: 4px;
    }

    .billing-from a {
      color: #e5531e;
      text-decoration: underline;
      font-weight: 600;
    }

    .billing-from a:hover {
      text-decoration-color: #e5531e;
    }

    .billing-to {
      text-align: right;
    }

    .billing-to p:nth-child(2) {
      margin-top: 4px;
    }

    .page-content {
      flex: 1;
      padding: 10mm 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .invoice-table {
      display: flex;
      flex-direction: column;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    .table-header {
      height: 12mm;
      background-color: #f3f4f6;
      display: flex;
      border-bottom: 1px solid #e5e7eb;
    }

    .table-header-cell {
      flex: 1;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      font-weight: 900;
      color: #374151;
      font-size: 15px;
    }

    .table-header-cell:nth-child(1) {
      flex: 1.2;
    }

    .table-header-cell:nth-child(2) {
      flex: 0.6;
      justify-content: flex-end;
    }

    .table-header-cell:nth-child(3) {
      flex: 0.8;
      justify-content: flex-end;
    }

    .table-header-cell:nth-child(4) {
      flex: 0.8;
      justify-content: flex-end;
      padding-right: 16px;
    }

    .table-rows-container {
      flex: 1;
      overflow: hidden;
      background-color: white;
    }

    .table-row {
      min-height: 23mm;
      display: flex;
      border-bottom: 1px solid #e5e7eb;
      font-size: 15px;
      font-weight: 500;
      page-break-inside: avoid;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
    }

    .table-row:last-child {
      border-bottom: none;
    }

    .table-cell {
      flex: 1;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #374151;
    }

    .table-cell.desc {
      flex: 1.2;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      font-size: 15px;
    }

    .table-cell.align-right {
      justify-content: flex-end;
    }

    .page-footer {
      height: 20mm;
      padding: 14px 32px;
      background-color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border-bottom: 7px solid rgba(229, 83, 30, 0.83);
    }

    .footer-text {
      font-size: 14px;
      color: #6b7280;
      text-align: center;
      line-height: 1.6;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .footer-text a {
      color: #e5531e;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    .footer-text span.highlight {
      color: #e5531e;
      font-weight: 600;
    }

    .footer-bottom {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      font-size: 14px;
      color: #6b7280;
      font-weight: 600;
    }

    @page {
      size: A4;
      margin: 0;
    }

    @media print {
      body {
        background-color: white;
        padding: 0;
      }

      .a4-page {
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>

<body>
  <!-- Handlebars-safe JSON injection -->
  <script type="application/json" id="invoice-data">
      {{{toJson data}}}
    </script>

  <div id="pages-container"></div>

  <script>
    // Convert millimeters to pixels (1in = 96px, 1in = 25.4mm)
    function mmToPx(mm) {
      return (mm * 96) / 25.4;
    }

    function measuredHeight(element) {
      const rect = element.getBoundingClientRect();
      return rect.height;
    }

    // DATA PARSING
    const rawInvoice =
      document.getElementById('invoice-data')?.textContent || '{}';
    let invoiceData;
    try {
      invoiceData = JSON.parse(rawInvoice);
    } catch (err) {
      console.error('Failed to parse invoice JSON', err);
      invoiceData = {};
    }

    // extract items safely
    const items = Array.isArray(invoiceData.lineItems)
      ? invoiceData.lineItems
      : [];

    // Check if we have valid data
    if (items.length === 0) {
      console.error('No line items found in invoice data!');
    }

    // DOM BUILDERS FOR COMPONENTS
    function createHeader(data) {
      const header = document.createElement('div');
      header.className = 'page-header bottom-divider';

      const headerTop = document.createElement('div');
      headerTop.className = 'header-top';

      const headerLeft = document.createElement('div');
      headerLeft.className = 'header-left';
      const img = document.createElement('img');
      img.src =
        'https://res.cloudinary.com/kahmyl/image/upload/f_png/v1695824140/vitract_logo_a3hdce.png';
      img.alt = 'Vitract';
      headerLeft.appendChild(img);

      const headerRight = document.createElement('div');
      headerRight.className = 'header-right';
      const h2 = document.createElement('h2');
      h2.textContent = 'Invoice';
      headerRight.appendChild(h2);

      headerTop.appendChild(headerLeft);
      headerTop.appendChild(headerRight);

      const headerBottom = document.createElement('div');
      headerBottom.className = 'header-bottom';

      const headerInfo = document.createElement('div');
      headerInfo.className = 'header-info';

      const issueP = document.createElement('p');
      issueP.innerHTML = 'Issue Date: ';
      const issueSpan = document.createElement('span');
      issueSpan.textContent = data.issueDate || '—';
      issueP.appendChild(issueSpan);

      const dueP = document.createElement('p');
      dueP.innerHTML = 'Due Date: ';
      const dueSpan = document.createElement('span');
      dueSpan.textContent = data.dueDate || '—';
      dueP.appendChild(dueSpan);

      headerInfo.appendChild(issueP);
      headerInfo.appendChild(dueP);

      const headerRightInfo = document.createElement('div');
      headerRightInfo.className = 'header-right-info';
      const invoiceP = document.createElement('p');
      invoiceP.innerHTML = 'Invoice #: ';
      const invoiceSpan = document.createElement('span');
      invoiceSpan.textContent = data.invoiceNumber || '—';
      invoiceP.appendChild(invoiceSpan);
      headerRightInfo.appendChild(invoiceP);

      headerBottom.appendChild(headerInfo);
      headerBottom.appendChild(headerRightInfo);

      header.appendChild(headerTop);
      header.appendChild(headerBottom);

      return header;
    }

    function createBilling(data) {
      const billingSection = document.createElement('div');
      billingSection.className = 'billing-section bottom-divider';

      const billingDetails = document.createElement('div');
      billingDetails.className = 'billing-details';

      const billingFrom = document.createElement('div');
      billingFrom.className = 'billing-from';

      const fromLabel = document.createElement('div');
      fromLabel.className = 'billing-label';
      fromLabel.textContent = 'Bill from:';
      billingFrom.appendChild(fromLabel);

      [
        'Vitract, Inc.',
        '838 Walker Road',
        'Dover, Delaware, 19904',
        '+1 302-303-3693',
      ].forEach((text) => {
        const p = document.createElement('p');
        p.textContent = text;
        billingFrom.appendChild(p);
      });

      const emailP = document.createElement('p');
      const emailLink = document.createElement('a');
      emailLink.href = 'mailto:billing@vitract.com';
      emailLink.textContent = 'billing@vitract.com';
      emailP.appendChild(emailLink);
      billingFrom.appendChild(emailP);

      const billingTo = document.createElement('div');
      billingTo.className = 'billing-to';

      const toLabel = document.createElement('div');
      toLabel.className = 'billing-label';
      toLabel.textContent = 'Bill to:';
      billingTo.appendChild(toLabel);

      const nameP = document.createElement('p');
      nameP.textContent = data.billToName || '—';
      const emailToP = document.createElement('p');
      emailToP.textContent = data.billToEmail || '—';

      billingTo.appendChild(nameP);
      billingTo.appendChild(emailToP);

      billingDetails.appendChild(billingFrom);
      billingDetails.appendChild(billingTo);
      billingSection.appendChild(billingDetails);

      return billingSection;
    }

    function createTableHeader() {
      const header = document.createElement('div');
      header.className = 'table-header';

      const headers = ['Description', 'Qty', 'Unit price', 'Amount'];
      headers.forEach((text) => {
        const cell = document.createElement('div');
        cell.className = 'table-header-cell';
        cell.textContent = text;
        header.appendChild(cell);
      });

      return header;
    }

    // Build rows with DOM
    function createRow(item) {
      const row = document.createElement('div');
      row.className = 'table-row';

      // Description cell (stacked)
      const desc = document.createElement('div');
      desc.className = 'table-cell desc';

      const p1 = document.createElement('p');
      p1.textContent =
        item.orderType === 'monthly-billing'
          ? `Client: ${item.client || '—'}`
          : 'Kit on-site';

      const p2 = document.createElement('p');
      p2.textContent = item.testType || '—';

      const p3 = document.createElement('p');
      p3.style.color = '#A3A1A8';
      p3.textContent = item.createdAt || '—';

      desc.appendChild(p1);
      desc.appendChild(p2);
      desc.appendChild(p3);
      row.appendChild(desc);

      // Qty
      const qty = document.createElement('div');
      qty.className = 'table-cell align-right';
      qty.style.flex = '0.6';
      qty.textContent = item.qty != null ? String(item.qty) : '0';
      row.appendChild(qty);

      // Unit price
      const unit = document.createElement('div');
      unit.className = 'table-cell align-right';
      unit.style.flex = '0.8';
      unit.textContent = item.unitPrice || '—';
      row.appendChild(unit);

      // Amount
      const amt = document.createElement('div');
      amt.className = 'table-cell align-right';
      amt.style.flex = '0.8';
      amt.style.paddingRight = '16px';
      amt.textContent = item.amount || '—';
      row.appendChild(amt);

      return row;
    }

    // Build totals with DOM
    function createTotals(data) {
      const wrapper = document.createElement('div');
      wrapper.style.padding = '10mm 5px';

      const container = document.createElement('div');
      container.style.display = 'flex';
      container.style.flexDirection = 'column';
      container.style.justifyContent = 'flex-end';
      container.style.fontSize = '15px';
      container.style.color = '#484352';
      container.style.paddingLeft = '50%';

      function addRow(label, value, strong = false) {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.justifyContent = 'space-between';
        row.style.padding = '15px 0';
        row.style.borderBottom = '1px solid #e5e7eb';
        if (strong) {
          row.style.fontWeight = '900';
          row.style.color = '#19233f';
        }

        const left = document.createElement('span');
        left.textContent = label;
        const right = document.createElement('span');
        right.textContent = value || '—';

        row.appendChild(left);
        row.appendChild(right);
        container.appendChild(row);
      }

      addRow('Subtotal', data.subtotal || 0);

      const discountLabel =
        'Discount' + (data.discountCode ? ` (${data.discountCode})` : '');
      addRow(discountLabel, data.discount || 0);

      addRow('Total', data.total || 0);
      addRow('AMOUNT PAID', data.amountPaid || 0, true);

      wrapper.appendChild(container);
      return wrapper;
    }

    function createFooter(isLastPage, pageNum, totalPages) {
      const footer = document.createElement('div');
      footer.className = `page-footer ${isLastPage ? 'top-divider' : ''}`;

      const footerText = document.createElement('div');
      footerText.className = 'footer-text';
      footerText.style.justifyContent = isLastPage ? 'center' : 'flex-start';

      if (!isLastPage) {
        const continued = document.createElement('span');
        continued.style.color = '#1155CC';
        continued.style.fontWeight = '600';
        continued.style.fontStyle = 'italic';
        continued.style.fontSize = '15px';
        continued.textContent = '...continued on next page';
        footerText.appendChild(continued);
      } else {
        const lead = document.createElement('span');
        lead.appendChild(
          document.createTextNode(
            'If you have any questions, contact us at ',
          ),
        );

        const emailLink = document.createElement('a');
        emailLink.href = 'mailto:hello@vitract.com';
        emailLink.textContent = 'hello@vitract.com';

        const mid = document.createElement('span');
        mid.appendChild(document.createTextNode(' or call us '));

        const phone = document.createElement('span');
        phone.className = 'highlight';
        phone.textContent = '+1 302-303-3693';

        const dot = document.createElement('span');
        dot.appendChild(document.createTextNode('.'));

        footerText.appendChild(lead);
        footerText.appendChild(emailLink);
        footerText.appendChild(mid);
        footerText.appendChild(phone);
        footerText.appendChild(dot);
      }

      const footerBottom = document.createElement('div');
      footerBottom.className = 'footer-bottom';
      const pageSpan = document.createElement('span');
      pageSpan.textContent = `${pageNum}/${totalPages}`;
      footerBottom.appendChild(pageSpan);

      footer.appendChild(footerText);
      footer.appendChild(footerBottom);

      return footer;
    }

    // MEASUREMENT-BASED PAGINATION
    function renderPages() {
      // Don't render if we have no items
      if (items.length === 0) {
        const container = document.getElementById('pages-container');
        container.innerHTML = '<div style="padding: 20px; color: red;">Error: No invoice items to display</div>';
        return;
      }
      // Build a hidden temp area for measurement
      const temp = document.createElement('div');
      temp.style.position = 'absolute';
      temp.style.left = '-9999px';
      temp.style.top = '0';
      temp.style.visibility = 'hidden';
      temp.style.width = '210mm';
      document.body.appendChild(temp);

      // Measure components
      const headerClone = createHeader(invoiceData);
      const billingClone = createBilling(invoiceData);
      const footerClone = createFooter(true, 1, 1);

      temp.appendChild(headerClone);
      temp.appendChild(billingClone);
      temp.appendChild(footerClone);

      const tableForMeasure = document.createElement('div');
      tableForMeasure.className = 'invoice-table';
      tableForMeasure.appendChild(createTableHeader());

      const rowsContainer = document.createElement('div');
      rowsContainer.className = 'table-rows-container';
      tableForMeasure.appendChild(rowsContainer);
      temp.appendChild(tableForMeasure);

      // Create and measure all rows
      const rowNodes = items.map((it) => createRow(it));
      rowNodes.forEach((r) => rowsContainer.appendChild(r));

      // Get page height
      const pageSample = document.createElement('div');
      pageSample.className = 'a4-page';
      pageSample.style.visibility = 'hidden';
      document.body.appendChild(pageSample);
      const pageHeightPx = measuredHeight(pageSample) || mmToPx(297);
      document.body.removeChild(pageSample);

      const headerHeight = measuredHeight(headerClone);
      const billingHeight = measuredHeight(billingClone);
      const footerHeight = measuredHeight(footerClone);
      const tableHeaderHeight = measuredHeight(
        tableForMeasure.querySelector('.table-header'),
      );

      const firstAvailable =
        pageHeightPx -
        headerHeight -
        billingHeight -
        footerHeight -
        tableHeaderHeight -
        mmToPx(20);
      const otherAvailable =
        pageHeightPx -
        headerHeight -
        footerHeight -
        tableHeaderHeight -
        mmToPx(20);

      // Distribute rows into pages
      const pages = [];
      let current = { rows: [], used: 0, limit: firstAvailable };

      rowNodes.forEach((r) => {
        const h = measuredHeight(r);
        if (current.used + h > current.limit && current.rows.length > 0) {
          pages.push(current);
          current = { rows: [], used: 0, limit: otherAvailable };
        }
        current.rows.push(r);
        current.used += h;
      });

      if (current.rows.length > 0 || pages.length === 0) {
        pages.push(current);
      }

      // Measure totals and ensure it fits
      const totalsNode = createTotals(invoiceData);
      temp.appendChild(totalsNode);

      const totalsHeight = measuredHeight(totalsNode);

      const lastPage = pages[pages.length - 1];
      const remainingOnLast = lastPage.limit - lastPage.used;

      if (remainingOnLast < totalsHeight) {
        pages.push({ rows: [], used: 0, limit: otherAvailable });
      }

      // Cleanup temp
      document.body.removeChild(temp);

      // Build actual pages
      const container = document.getElementById('pages-container');
      const totalPages = pages.length;

      pages.forEach((pageData, pageIndex) => {
        const pageNum = pageIndex + 1;
        const isFirstPage = pageNum === 1;
        const isLastPage = pageNum === totalPages;

        const page = document.createElement('div');
        page.className = 'a4-page';

        // Header
        page.appendChild(createHeader(invoiceData));

        // Billing (first page only)
        if (isFirstPage) {
          page.appendChild(createBilling(invoiceData));
        }

        // Content
        const content = document.createElement('div');
        content.className = 'page-content';

        // Only render table if there are rows on this page
        if (pageData.rows.length > 0) {
          const table = document.createElement('div');
          table.className = 'invoice-table';
          table.appendChild(createTableHeader());

          const rows = document.createElement('div');
          rows.className = 'table-rows-container';

          pageData.rows.forEach((row) => {
            rows.appendChild(row.cloneNode(true));
          });

          table.appendChild(rows);
          content.appendChild(table);
        }

        // Totals (last page only)
        if (isLastPage) {
          content.appendChild(createTotals(invoiceData));
        }

        page.appendChild(content);

        // Footer
        page.appendChild(createFooter(isLastPage, pageNum, totalPages));

        container.appendChild(page);
      });

      container.dataset.pdfReady = '1';
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(renderPages).catch(() => renderPages());
    } else {
      setTimeout(renderPages, 50);
    }
  </script>
</body>

</html>
